<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J233 PECENONGAN - Per Tgl</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#0f0f0f;color:#fff}
.header{background:linear-gradient(180deg,#4a0a0a,#0f0f0f);padding:16px;position:sticky;top:0;z-index:10}
.card{background:#1c1c1c;border:1px solid #2b2b2b;border-radius:20px;padding:14px;margin:12px}
.btn{border:0;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.btn-red{background:#E30613;color:#fff}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #444}
.btnWA{background:#25D366;color:#fff;padding:10px;border-radius:10px;font-weight:800;border:0;width:100%}
input,select{background:#0f0f0f;border:1px solid #333;color:#fff;border-radius:10px;padding:10px;width:100%}
.tab{display:flex;gap:8px;margin:12px}.tab div{flex:1;text-align:center;padding:12px;border-radius:14px;background:#1c1c1c;border:1px solid #2b2b2b;cursor:pointer}.tab div.active{background:#E30613;border-color:#E30613}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:#888;padding:8px;text-align:left}td{padding:8px;border-top:1px solid #262626}
.minus{color:#ff5a5a;font-weight:800}.plus{color:#3dd68c}
.histItem{background:#242424;border:1px solid #333;border-radius:16px;padding:14px;margin-bottom:10px}
.dateBadge{background:#E30613;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;justify-content:space-between"><span style="background:#fff;color:#E30613;padding:4px 8px;border-radius:6px;font-weight:800">Alfamart</span><b>J233 PECENONGAN</b></div>
<h2 style="margin:12px 0 4px">Stock Opname Per Tanggal</h2>
<input type="date" id="tglSO" onchange="gantiTanggal()" style="background:#fff;color:#000;font-weight:700">
<small id="infoTgl" style="color:#aaa;display:block;margin-top:6px"></small>
</div>

<div class="tab"><div id="tabSO" class="active" onclick="switchTab('so')">📦 SO</div><div id="tabHist" onclick="switchTab('hist')">📜 Histori Per Tgl</div></div>

<div id="pageSO">
<div class="card" style="display:flex;justify-content:space-between"><div><small style="color:#aaa">TOTAL TGL INI</small><br><b class="minus" style="font-size:22px">Rp <span id="total">0</span></b></div><div style="text-align:right"><small id="progText" style="color:#aaa">0/37</small><br><b id="pct">0%</b></div></div>
<div class="card"><table><thead><tr><th>Produk</th><th>Sys</th><th>Fisik</th><th>Sel</th></tr></thead><tbody id="body"></tbody></table>
<button class="btn btn-red" style="width:100%;margin-top:12px" onclick="simpanPerTgl()">💾 Simpan SO Tanggal Ini</button>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="exportCSV()">⬇️ Export Excel Tgl Ini</button>
</div>
</div>

<div id="pageHist" style="display:none">
<div class="card"><b>Histori SO Per Tanggal</b><br><small style="color:#aaa">Pilih tanggal untuk lihat & kirim WA</small><div id="histList" style="margin-top:12px"></div></div>
</div>

<script>
const DATA=[
[1595,"SILVERQUEEN ALMOND 52G",12000],[5867,"AQUA 1500ML",6000],[113079,"TROPICAL 2L",35000],[118898,"GOOD DAY MOCA 10x20G",18000],[120333,"PUCUK HARUM 350 ML",4000],[192730,"BIMOLI 2L",34000],[196009,"BEAR BRAND 189ML",9500],[230169,"KINDER JOY BOYS",13000],[230170,"KINDER JOY GIRLS",13000],[244111,"SUNCO 2L",36000],[400552,"ABC MILK COFFE 200ML",3500],[415196,"PAROTI KRIM MESS 200G",12000],[417804,"KANZLER ORI 65G",9000],[417805,"KANZLER KEJU 65G",9000],[423992,"KANZLER HOT 65G",9000],[432393,"GOLDA CAPPUCHINO",3500],[434860,"ORI OMELA",12000],[435578,"KANZLER GOCHU 60G",9000],[435736,"KANZLER BAKSO HOT 48G",7000],[441258,"COLLAGENA 189ML",12000],[443704,"FIESTA SOSIS SPICY",15000],[465771,"KANZLER BAKSO GOCU 55G",9000],[990055,"LE MINERALE 600 ML",3000],[450862,"KAHF ACNE GEL 100ML",38000],[450863,"KAHF BRIGHT GEL 100ML",38000],[445967,"KAHF ACN&POR SCR 100ML",42000],[432462,"KAHF OIL&COMEDO 100ML",35000],[423647,"KAHF OIL&ACNE 100ML",35000],[423646,"KAHF ENERGIZING 100ML",35000],[427902,"KAHF SCRUB EXP 100ML",42000],[124502,"SIDOMUNCUL ANGIN 5x15ML",18000],[418604,"RAW CUP ICE 16OZ",4000],[422550,"ALFA ECO PAPER",1500],[414633,"ECO BAG KECIL",500],[413095,"ECO BAG BESAR",1000],[421454,"ALFA TISSUE 220 G",12000],[421456,"ALFA TISSUE 400 G",20000]
].map(x=>({plu:x[0],desc:x[1],harga:x[2],qSistem:0,qFisik:0}));
const KEY_HIST="J233_HISTORI_PER_TGL";
let hist=JSON.parse(localStorage.getItem(KEY_HIST)||"{}");
let tglAktif=new Date().toISOString().split('T')[0];
document.getElementById("tglSO").value=tglAktif;
function getItemsTgl(tgl){if(hist[tgl]&&hist[tgl].items)return hist[tgl].items;return JSON.parse(JSON.stringify(DATA));}
let items=getItemsTgl(tglAktif);
function render(){
const tb=document.getElementById("body");tb.innerHTML="";let tot=0,selesai=0;
items.forEach((it,i)=>{const sel=(Number(it.qFisik)||0)-(Number(it.qSistem)||0);const selRp=sel*it.harga;it.selisih=sel;it.selisihRp=selRp;tot+=selRp;if(Number(it.qFisik)!=0||Number(it.qSistem)!=0)selesai++;
tb.innerHTML+=`<tr><td><b style="font-size:11px">${it.desc}</b><br><small style="color:#666">${it.plu}</small></td><td><input type="number" value="${it.qSistem}" oninput="items[${i}].qSistem=this.value;autoSave()"></td><td><input type="number" value="${it.qFisik}" oninput="items[${i}].qFisik=this.value;autoSave()"></td><td class="${sel<0?'minus':'plus'}">${sel}</td></tr>`;
});
document.getElementById("total").innerText=Math.abs(tot).toLocaleString("id-ID");
document.getElementById("pct").innerText=Math.round(selesai/items.length*100)+"%";
document.getElementById("progText").innerText=selesai+"/"+items.length+" Produk";
document.getElementById("infoTgl").innerText="Edit SO untuk tanggal: "+tglAktif+" • Data auto kesimpen per tanggal";
}
function autoSave(){const tot=items.reduce((s,r)=>s+r.selisihRp,0);hist[tglAktif]={tgl:tglAktif,total:tot,items:JSON.parse(JSON.stringify(items)),update:new Date().toLocaleString("id-ID")};localStorage.setItem(KEY_HIST,JSON.stringify(hist));renderHist();}
function gantiTanggal(){tglAktif=document.getElementById("tglSO").value;items=getItemsTgl(tglAktif);render();renderHist();}
function simpanPerTgl(){autoSave();alert("✅ SO tanggal "+tglAktif+" disimpan! Cek di Histori Per Tgl.");switchTab('hist');}
function renderHist(){
const div=document.getElementById("histList");const keys=Object.keys(hist).sort().reverse();
if(keys.length==0){div.innerHTML="<small style='color:#777'>Belum ada data. Simpan SO dulu per tanggal.</small>";return;}
div.innerHTML=keys.map(k=>{
const h=hist[k];const jml=h.items.filter(r=>r.selisih!=0).length;
return `<div class="histItem">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="dateBadge">📅 ${h.tgl}</span><b class="${h.total<0?'minus':'plus'}">Rp ${h.total.toLocaleString("id-ID")}</b></div>
<small style="color:#aaa">Update: ${h.update} • ${jml} PLU selisih</small>
<div style="margin-top:10px;display:flex;gap:8px">
<button class="btnWA" onclick="bukaTgl('${k}')" style="background:#2a2a2a">📂 Buka</button>
<button class="btnWA" onclick="kirimWA('${k}')">📲 Kirim WA Tgl ${k}</button>
</div>
</div>`;
}).join("");
}
function bukaTgl(tgl){tglAktif=tgl;document.getElementById("tglSO").value=tgl;items=getItemsTgl(tgl);switchTab('so');render();}
function kirimWA(tgl){
const h=hist[tgl];if(!h)return;
const minus=h.items.filter(r=>r.selisih<0).sort((a,b)=>a.selisihRp-b.selisihRp).slice(0,5);
let pesan=`*LAPORAN SO J233 PECENONGAN*%0A*Tanggal SO: ${h.tgl}*%0AUpdate: ${h.update}%0A%0A*TOTAL: Rp ${h.total.toLocaleString("id-ID")}*%0A%0A*🔴 TOP 5 MINUS TGL ${h.tgl}:*%0A${minus.map((m,i)=>`${i+1}. ${m.desc} (${m.plu}) ${m.selisih} pcs -Rp ${Math.abs(m.selisihRp).toLocaleString("id-ID")}`).join("%0A")||"-"}%0A%0A*DETAIL ${h.items.filter(r=>r.selisih!=0).length} PLU SELISIH:*%0A${h.items.filter(r=>r.selisih!=0).map(r=>`- ${r.desc}: ${r.qSistem} vs ${r.qFisik} = ${r.selisih}`).join("%0A")}`;
window.open(`https://wa.me/?text=${pesan}`,"_blank");
}
function exportCSV(){let csv=`TANGGAL,${tglAktif}\nPLU,DESC,Sistem,Fisik,Selisih,Harga,Rp\n`;items.forEach(r=>csv+=`${r.plu},"${r.desc}",${r.qSistem},${r.qFisik},${r.selisih},${r.harga},${r.selisihRp}\n`);let b=new Blob([csv],{type:"text/csv"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`SO_J233_${tglAktif}.csv`;a.click();}
function switchTab(t){document.getElementById("pageSO").style.display=t=='so'?'block':'none';document.getElementById("pageHist").style.display=t=='hist'?'block':'none';document.getElementById("tabSO").className=t=='so'?'active':'';document.getElementById("tabHist").className=t=='hist'?'active':'';}
render();renderHist();
</script>
</body>
</html>
