<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KF33 SO FULL + WA</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f4f4f4}
header{background:#E30613;color:#fff;padding:12px;text-align:center;font-weight:800;position:sticky;top:0;z-index:10}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.btn{background:#E30613;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:700}
.btn2{background:#222;color:#fff;border:0;padding:10px 14px;border-radius:10px}
.btnWA{background:#25D366;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:800;width:100%;font-size:15px}
input{padding:7px;border:1px solid #ddd;border-radius:8px;width:100%;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#222;color:#fff;padding:8px;text-align:left}td{padding:6px;border-bottom:1px solid #eee}
.minus{color:#E30613;font-weight:800}.plus{color:#0a7a2b;font-weight:800}
</style>
</head>
<body>
<header>KF33 | KARET PEDURENAN 45 - SO PLU + KIRIM WA</header>

<div class="card">
<b>TOTAL: <span id="total" style="color:#E30613;font-size:22px">Rp 0</span></b>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
<button class="btn" onclick="save()">💾 Simpan</button>
<button class="btn2" onclick="exportCSV()">⬇️ Excel</button>
<button class="btn2" onclick="reset()">🗑️ Reset</button>
</div>
<div id="top5" style="margin-top:10px;background:#fff0f0;padding:10px;border-radius:10px;font-size:12px"></div>
<br>
<input id="waNumber" placeholder="No WA tujuan (opsional, kosongkan untuk pilih kontak) contoh: 62812xxxx">
<br><br>
<button class="btnWA" onclick="kirimWA()">📲 KIRIM LAPORAN KE WA</button>
<small style="color:#666">*Laporan otomatis isi Top 5 Minus, Total, & Detail PLU</small>
</div>

<div class="card" style="overflow:auto">
<table><thead><tr><th>SO</th><th>PLU</th><th>DESC</th><th>Sys</th><th>Fisik</th><th>Sel</th><th>Harga</th><th>Rp</th></tr></thead><tbody id="body"></tbody></table>
</div>

<script>
let items=[
[1595,"SILVERQUEEN ALMOND 52G",12000],[5867,"AQUA 1500ML",6000],[113079,"TROPICAL 2L",35000],[118898,"GOOD DAY MOCA",18000],[120333,"PUCUK HARUM 350 ML",4000],[192730,"BIMOLI 2L",34000],[196009,"BEAR BRAND 189ML",9500],[230169,"KINDER JOY BOYS",13000],[230170,"KINDER JOY GIRLS",13000],[244111,"SUNCO 2L",36000],[400552,"ABC MILK COFFE 200ML",3500],[415196,"PAROTI KRIM MESS 200G",12000],[417804,"KANZLER ORI 65G",9000],[417805,"KANZLER KEJU 65G",9000],[423992,"KANZLER HOT 65G",9000],[432393,"GOLDA CAPPUCHINO",3500],[434860,"ORI OMELA",12000],[435578,"KANZLER GOCHU 60G",9000],[435736,"KANZLER BAKSO HOT 48G",7000],[441258,"COLLAGENA 189ML",12000],[443704,"FIESTA SOSIS SPICY",15000],[465771,"KANZLER BAKSO GOCU 55G",9000],[990055,"LE MINERALE 600 ML",3000],[450862,"KAHF ACNE GEL",38000],[450863,"KAHF BRIGHT GEL",38000],[445967,"KAHF ACN&POR SCR",42000],[432462,"KAHF OIL&COMEDO",35000],[423647,"KAHF OIL&ACNE",35000],[423646,"KAHF ENERGIZING",35000],[427902,"KAHF SCRUB EXP",42000],[124502,"SIDOMUNCUL ANGIN",18000],[418604,"RAW CUP ICE 16OZ",4000],[422550,"ALFA ECO PAPER",1500],[414633,"ECO BAG KECIL",500],[413095,"ECO BAG BESAR",1000],[421454,"ALFA TISSUE 220 G",12000],[421456,"ALFA TISSUE 400 G",20000]
].map(x=>({plu:x[0],desc:x[1],harga:x[2],qSistem:0,qFisik:0,selisih:0,selisihRp:0,sudah:false}));
const KEY="KF33_SO_FULL_WA_V3";let sv=localStorage.getItem(KEY);if(sv){try{items=JSON.parse(sv);}catch{}}
function render(){
const tb=document.getElementById("body");tb.innerHTML="";
items.forEach((it,i)=>{
const selQty=(Number(it.qFisik)||0)-(Number(it.qSistem)||0);const selRp=selQty*(Number(it.harga)||0);it.selisih=selQty;it.selisihRp=selRp;
const tr=document.createElement("tr");
tr.innerHTML=`<td><input type="checkbox" ${it.sudah?"checked":""} onchange="items[${i}].sudah=this.checked;saveAuto()"></td><td><b>${it.plu}</b></td><td>${it.desc}</td><td><input type="number" value="${it.qSistem}" oninput="items[${i}].qSistem=this.value;calc(${i})"></td><td><input type="number" value="${it.qFisik}" oninput="items[${i}].qFisik=this.value;calc(${i})"></td><td class="${selQty<0?"minus":selQty>0?"plus":""}">${selQty}</td><td><input type="number" value="${it.harga}" oninput="items[${i}].harga=this.value;calc(${i})" style="width:70px"></td><td class="${selRp<0?"minus":"plus"}">${selRp.toLocaleString("id-ID")}</td>`;
tb.appendChild(tr);
});update();
}
function calc(i){const it=items[i];const selQty=(Number(it.qFisik)||0)-(Number(it.qSistem)||0);const selRp=selQty*(Number(it.harga)||0);it.selisih=selQty;it.selisihRp=selRp;const row=document.querySelectorAll("#body tr")[i];row.children[5].innerText=selQty;row.children[5].className=selQty<0?"minus":selQty>0?"plus":"";row.children[7].innerText=selRp.toLocaleString("id-ID");row.children[7].className=selRp<0?"minus":"plus";update();saveAuto();}
function update(){let tot=0;items.forEach(r=>tot+=Number(r.selisihRp)||0);document.getElementById("total").innerText="Rp "+tot.toLocaleString("id-ID");let minus=[...items].filter(r=>r.selisihRp<0).sort((a,b)=>a.selisihRp-b.selisihRp).slice(0,5);let plus=[...items].filter(r=>r.selisihRp>0).sort((a,b)=>b.selisihRp-a.selisihRp).slice(0,5);document.getElementById("top5").innerHTML=`<b>🔴 Top 5 Minus:</b><br>${minus.map(m=>`${m.plu} ${m.desc} (${m.selisih}) = -Rp ${Math.abs(m.selisihRp).toLocaleString("id-ID")}`).join("<br>")||"-"}<br><br><b>🟢 Top 5 Plus:</b><br>${plus.map(m=>`${m.plu} ${m.desc} (${m.selisih}) = +Rp ${m.selisihRp.toLocaleString("id-ID")}`).join("<br>")||"-"}`;}
function saveAuto(){localStorage.setItem(KEY,JSON.stringify(items));}
function save(){saveAuto();alert("✅ Kesimpen di HP!");}
function reset(){if(confirm("Reset?")){items.forEach(r=>{r.qSistem=0;r.qFisik=0;r.sudah=false});localStorage.removeItem(KEY);render();}}
function exportCSV(){let csv="PLU,DESC,Sistem,Fisik,Selisih,Harga,Selisih Rp\n";items.forEach(r=>csv+=`${r.plu},"${r.desc}",${r.qSistem},${r.qFisik},${r.selisih},${r.harga},${r.selisihRp}\n`);const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="SO_KF33_WA.csv";a.click();}
function kirimWA(){
let tot=items.reduce((s,r)=>s+Number(r.selisihRp),0);
let minus=[...items].filter(r=>r.selisihRp<0).sort((a,b)=>a.selisihRp-b.selisihRp).slice(0,5);
let plus=[...items].filter(r=>r.selisihRp>0).sort((a,b)=>b.selisihRp-a.selisihRp).slice(0,5);
let tgl=new Date().toLocaleDateString("id-ID");
let pesan=`*LAPORAN SO BARU - KF33 | KARET PEDURENAN 45*\nTanggal: ${tgl}\n\n*TOTAL SELISIH: Rp ${tot.toLocaleString("id-ID")}*\n\n*🔴 TOP 5 MINUS:*\n${minus.map((m,i)=>`${i+1}. ${m.plu} ${m.desc} | ${m.selisih} pcs | -Rp ${Math.abs(m.selisihRp).toLocaleString("id-ID")}`).join("\n")||"-"}\n\n*🟢 TOP 5 PLUS:*\n${plus.map((m,i)=>`${i+1}. ${m.plu} ${m.desc} | ${m.selisih} pcs | +Rp ${m.selisihRp.toLocaleString("id-ID")}`).join("\n")||"-"}\n\n*DETAIL LENGKAP (${items.filter(r=>r.selisih!=0).length} PLU selisih):*\n${items.filter(r=>r.selisih!=0).map(r=>`- ${r.plu} ${r.desc}: Sys ${r.qSistem} vs Fisik ${r.qFisik} = ${r.selisih} pcs (Rp ${r.selisihRp.toLocaleString("id-ID")})`).join("\n")||"Tidak ada selisih"}\n\n_Dikirim dari SO Offline KF33_`;
let no=document.getElementById("waNumber").value.trim();
let url = no? `https://wa.me/${no}?text=${encodeURIComponent(pesan)}` : `https://wa.me/?text=${encodeURIComponent(pesan)}`;
window.open(url,"_blank");
}
render();
</script>
</body>
</html>
